name: Nightly Acceptance Tests

on:
  schedule:
    # Will run at 00:00 every day
    - cron: "0 0 * * *"

permissions: {}

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        products:
          - account
          - annotations
          - applesilicon
          - audittrail
          - autoscaling
          - az
          - baremetal
          - billing
          - block
          - cockpit
          - container
          - datawarehouse
          - datalab
          - domain
          - edgeservices
          - file
          - flexibleip
          - function
          - iam
          - inference
          - instance
          - interlink
          - iot
          - ipam
          - jobs
          - k8s
          - kafka
          - keymanager
          - lb
          - mailbox
          - marketplace
          - messageq
          - mnq
          - mongodb
          - object
          - opensearch
          - partner
          - rdb
          - redis
          - registry
          - s2svpn
          - sdb
          - secret
          - tem
          - vpc
          - vpcgw
          - webhosting
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-latest' }}"
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/checkout
      - uses: $/.github/actions/mise
      - name: Run Acceptance Tests
        run: mise run test:provider --format github-actions --timeout 4h --acceptance --cassettes ./internal/services/${{ matrix.products }}/...
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PARTNER_ACCESS_KEY: ${{ secrets.SCW_PARTNER_ACCESS_KEY }}
          SCW_PARTNER_SECRET_KEY: ${{ secrets.SCW_PARTNER_SECRET_KEY }}
          TF_RETRY_DELAY: 30s
          TF_LOG: DEBUG
      - name: Ping on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ failure() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NIGHTLY }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ github.repository }} nightly workflow failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ matrix.products }}>"

  acceptance:
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-latest' }}"
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        tool:
          - terraform
          - opentofu
    steps:
      - uses: $/.github/actions/checkout
      - uses: $/.github/actions/mise
      - run: mise run test:provider --acceptance --tool ${{ matrix.tool }}

  # sweeper needs to run after nightly completed
  # no matter what are the results of the jobs
  sweeper:
    runs-on: "${{ vars.RUNS_ON || 'ubuntu-latest' }}"
    needs: nightly
    if: always()
    steps:
      - uses: $/.github/actions/checkout
      - uses: $/.github/actions/mise
      - run: mise run sweep
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      - name: Ping on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ failure() }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_NIGHTLY }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ github.repository }} nightly workflow failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|sweeper>"
