name: mise
inputs:
  cache_save:
    default: false
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.10.8
        cache: true
        cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        experimental: true
