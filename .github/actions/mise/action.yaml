name: mise
inputs:
  cache:
    default: true
  cache_save:
    default: false
runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: 2026.11.7
        cache: ${{ inputs.cache }}
        cache_save: ${{ inputs.cache_save }}
        experimental: true
